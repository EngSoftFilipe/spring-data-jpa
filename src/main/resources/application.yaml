spring:
  application:
    name: spring-data-jpa

  main:
    banner-mode: off

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      pool-name: springdatajpa-pool
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate

  output:
    ansi:
      enabled: always

logging:
  pattern:
    console: "%highlight(%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n%ex)"